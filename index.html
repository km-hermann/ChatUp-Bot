<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ChatUp</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/style.css" />
  </head>

  <body>
    <div class="chat-container">
      <header class="chat-header">
        <div class="header-left">
          <div id="profileAvatar" class="profileAvatar" aria-label="User profile">
            <span class="avatar-initial" id="avatarInitial"></span>
            <svg class="icon avatar-placeholder" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="8" r="3.25" fill="none" stroke="currentColor" stroke-width="1.75" />
              <path
                fill="none"
                stroke="currentColor"
                stroke-width="1.75"
                stroke-linecap="round"
                d="M5.5 18.5c1.4-2.6 3.7-4 6.5-4s5.1 1.4 6.5 4"
              />
            </svg>
          </div>
        </div>

        <div class="header-brand">
          <span class="brand-mark" aria-hidden="true">
            <svg class="icon" viewBox="0 0 24 24">
              <path
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M7 18.5l-2.4 2.1c-.5.4-1.2 0-1.1-.6V7.2C3.5 5.4 5 4 7 4h10c2 0 3.5 1.4 3.5 3.2v7.1c0 1.8-1.5 3.2-3.5 3.2H7z"
              />
              <circle cx="8.5" cy="10.5" r="1" fill="currentColor" />
              <circle cx="12" cy="10.5" r="1" fill="currentColor" />
              <circle cx="15.5" cy="10.5" r="1" fill="currentColor" />
            </svg>
          </span>
          <div class="brand-copy">
            <h1>ChatUp</h1>
            <p>Online</p>
          </div>
        </div>

        <div class="options">
          <button id="toggle-dark" class="icon-btn" type="button" aria-label="Toggle theme">
            <svg class="icon icon-moon" viewBox="0 0 24 24" aria-hidden="true">
              <path
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M16.5 13.2A7 7 0 0 1 10.8 5a6.5 6.5 0 1 0 5.7 8.2z"
              />
            </svg>
            <svg class="icon icon-sun" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="3.6" fill="none" stroke="currentColor" stroke-width="1.8" />
              <path
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                d="M12 3.2v1.8M12 19v1.8M4.9 4.9l1.3 1.3M17.8 17.8l1.3 1.3M3.2 12h1.8M19 12h1.8M4.9 19.1l1.3-1.3M17.8 6.2l1.3-1.3"
              />
            </svg>
          </button>
          <button id="clear-chat" class="icon-btn" type="button" aria-label="Clear chat">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
              <path
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M5 7.5h14M10 7.5V5.8c0-.4.3-.8.8-.8h2.4c.5 0 .8.4.8.8v1.7M8.2 7.5V18c0 .8.6 1.5 1.4 1.5h4.8c.8 0 1.4-.7 1.4-1.5V7.5M10.2 11v5.2M13.8 11v5.2"
              />
            </svg>
          </button>
        </div>
      </header>

      <div id="chat-window" class="chat-window"></div>

      <form id="chat-form" autocomplete="off">
        <div class="composer">
          <textarea
            id="user-input"
            placeholder="Message ChatUp..."
            required
            rows="1"
          ></textarea>
          <button type="submit" class="send-btn" aria-label="Send message">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
              <path
                fill="currentColor"
                d="M4.2 11.1 19.1 4.4c.8-.4 1.6.4 1.2 1.2l-6.7 14.9c-.4.8-1.6.7-1.8-.2l-1.6-6.3-6.3-1.6c-.9-.2-1-1.4-.2-1.8z"
              />
            </svg>
          </button>
        </div>
      </form>
    </div>
    <script src="./js/script.js"></script>
  </body>
</html>
